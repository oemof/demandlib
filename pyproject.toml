[tool.ruff]
extend-exclude = ["static", "ci/templates"]
line-length = 79
src = ["src", "tests"]
target-version = "py313"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = [
  ".coveragerc",
  ".editorconfig",
  ".readthedocs.yml",
  ".pre-commit-config.yaml",
  "tox.ini",
  "AUTHORS.rst",
  "CHANGELOG.rst",
  "CONTRIBUTING.rst",
  "LICENSE",
  "README.rst",
  "examples/",
  "docs/",
  "src/",
  "tests/",
]
exclude = ["docs/_build", "**/*.egg-info"]

[project]
name = "demandlib"
dynamic = ["version"]
description = "Creating heat and power demand profiles from annual values"
readme = "README.rst"
authors = [{ name = "oemof developer group", email = "contact@oemof.org" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Unix",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = ["oemof.demand"]
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/oemof/oemof-demand"
Documentation = "https://oemof-demand.readthedocs.io/"
Changelog = "https://oemof-demand.readthedocs.io/en/latest/changelog.html"
"Issue Tracker" = "https://github.com/oemof/oemof-demand/issues/"

